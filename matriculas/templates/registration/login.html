<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>SIGE - Entrar</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .caixa { max-width: 360px; border: 1px solid #ccc; padding: 24px; border-radius: 8px; }
    h1 { color: #1f4e79; font-size: 24px; }
    button { background: #1f4e79; color: white; border: 0; padding: 10px 20px; cursor: pointer; }
    .erro { color: #b00020; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>SIGE - Entrar</h1>
    {% if form.errors %}
      <p class="erro">Utilizador ou palavra-passe incorretos.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
