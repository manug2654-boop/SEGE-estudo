<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>SIGE - Alunos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    table { border-collapse: collapse; width: 100%; max-width: 800px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #1f4e79; color: white; }
  </style>
</head>
<body>
  <h1>SIGE - Lista de Alunos</h1>   <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <p>Utilizador: <strong>{{ request.user.username }}</strong>
    <button type="submit">Sair</button></p>
  </form>
  <table>
    <tr>
      <th>Matrícula</th>
      <th>Nome</th>
      <th>Nascimento</th>
    </tr>
    {% for aluno in alunos %}
    <tr>
      <td>{{ aluno.numero_matricula }}</td>
      <td>{{ aluno.nome_completo }}</td>
      <td>{{ aluno.data_nascimento|date:'d/m/Y' }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">Nenhum aluno cadastrado.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
